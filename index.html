<section id="placar" class="section scoreboard-section">

    <div class="section-title">

        <span>INTERATIVO</span>

        <h2>
            Placar de Vôlei
        </h2>

    </div>


    <div class="scoreboard">


        <!-- EQUIPE 1 -->

        <div class="team">

            <input 
                type="text" 
                id="teamAName" 
                value="BRASIL"
                class="team-name"
            >

            <div id="scoreA" class="score">
                0
            </div>


            <div class="score-buttons">

                <button 
                    class="btn-score"
                    onclick="addPoint('A')">
                    + Ponto
                </button>


                <button 
                    class="btn-score btn-minus"
                    onclick="removePoint('A')">
                    - Ponto
                </button>

            </div>

        </div>



        <!-- CENTRO -->

        <div class="score-center">

            <span>
                VS
            </span>


            <!-- CRONÔMETRO -->

            <div class="timer">

                <h3 id="timer">
                    00:00
                </h3>


                <button 
                    class="reset"
                    onclick="startTimer()">
                    ▶ Iniciar
                </button>


                <button 
                    class="reset"
                    onclick="pauseTimer()">
                    ⏸ Pausar
                </button>


                <button 
                    class="reset"
                    onclick="resetTimer()">
                    🔄 Zerar
                </button>

            </div>


            <button 
                class="reset"
                onclick="resetScore()">
                Reiniciar Placar
            </button>


        </div>




        <!-- EQUIPE 2 -->

        <div class="team">


            <input 
                type="text" 
                id="teamBName" 
                value="ADVERSÁRIO"
                class="team-name"
            >


            <div id="scoreB" class="score">
                0
            </div>


            <div class="score-buttons">

                <button 
                    class="btn-score"
                    onclick="addPoint('B')">
                    + Ponto
                </button>


                <button 
                    class="btn-score btn-minus"
                    onclick="removePoint('B')">
                    - Ponto
                </button>

            </div>


        </div>


    </div>


</section>
